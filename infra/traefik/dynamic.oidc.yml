http:
  middlewares:
    auth-user:
      forwardAuth:
        address: "http://oauth2-proxy:4180/oauth2/auth"
        trustForwardHeader: true
        authResponseHeaders:
          - X-Auth-Request-User
          - X-Auth-Request-Email

    auth-admin:
      forwardAuth:
        address: "http://oauth2-proxy:4180/oauth2/auth"
        trustForwardHeader: true
        authResponseHeaders:
          - X-Auth-Request-User
          - X-Auth-Request-Email

  routers:
    oauth2:
      entryPoints:
        - web
      rule: "PathPrefix(`/oauth2`)"
      priority: 300
      service: oauth2-proxy

    comments-api-admin-delete:
      entryPoints:
        - web
      rule: "Method(`DELETE`) && PathRegexp(`^/api/threads/[^/]+/comments/[^/]+$`)"
      priority: 260
      middlewares:
        - auth-admin
      service: comments-api

    comments-api-admin-restore:
      entryPoints:
        - web
      rule: "Method(`POST`) && PathRegexp(`^/api/threads/[^/]+/comments/[^/]+/restore$`)"
      priority: 260
      middlewares:
        - auth-admin
      service: comments-api

    comments-api-post-comment:
      entryPoints:
        - web
      rule: "Method(`POST`) && PathRegexp(`^/api/threads/[^/]+/comments$`)"
      priority: 250
      middlewares:
        - auth-user
      service: comments-api

    comments-api-public:
      entryPoints:
        - web
      rule: "Method(`GET`) && PathPrefix(`/api/threads`)"
      priority: 200
      service: comments-api

    comments-stream:
      entryPoints:
        - web
      rule: "PathPrefix(`/events`)"
      priority: 200
      service: comments-stream

    manage:
      entryPoints:
        - web
      rule: "PathPrefix(`/manage`)"
      priority: 200
      middlewares:
        - auth-admin
      service: static-web

    static-web:
      entryPoints:
        - web
      rule: "PathPrefix(`/demo`) || PathPrefix(`/assets`) || Path(`/`)"
      priority: 100
      service: static-web

  services:
    comments-api:
      loadBalancer:
        servers:
          - url: "http://comments-api:3001"

    comments-stream:
      loadBalancer:
        servers:
          - url: "http://comments-stream:3002"

    static-web:
      loadBalancer:
        servers:
          - url: "http://static-web:80"

    oauth2-proxy:
      loadBalancer:
        servers:
          - url: "http://oauth2-proxy:4180"
