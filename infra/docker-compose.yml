services:
  traefik:
    image: traefik:v3.2
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --api.insecure=true
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ${TRAEFIK_DYNAMIC_FILE:-./traefik/dynamic.dev.yml}:/etc/traefik/dynamic.yml:ro
    networks:
      - comment0r

  auth-mock:
    build:
      context: ..
      dockerfile: services/auth-mock/Dockerfile
    environment:
      - PORT=3010
      - AUTH_COOKIE_NAME=comment0r_auth
    networks:
      - comment0r

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
    profiles: ["oidc"]
    command:
      - --http-address=0.0.0.0:4180
      - --provider=oidc
      - --oidc-issuer-url=${OIDC_ISSUER_URL:-https://example.invalid}
      - --client-id=${OIDC_CLIENT_ID:-example-client-id}
      - --client-secret=${OIDC_CLIENT_SECRET:-example-client-secret}
      - --redirect-url=${OIDC_REDIRECT_URL:-http://localhost/oauth2/callback}
      - --cookie-secret=${OAUTH2_PROXY_COOKIE_SECRET:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      - --cookie-secure=false
      - --email-domain=*
      - --set-xauthrequest=true
      - --pass-authorization-header=false
      - --pass-access-token=false
      - --pass-user-headers=true
      - --upstream=static://202
    networks:
      - comment0r

  static-web:
    build:
      context: ..
      dockerfile: static/Dockerfile
    networks:
      - comment0r

  comments-api:
    build:
      context: ..
      dockerfile: services/comments-api/Dockerfile
    environment:
      - PORT=3001
      - COUCHDB_URL=http://admin:password@couchdb:5984
      - COUCHDB_DB=comments
      - ADMIN_EMAIL_ALLOWLIST=${ADMIN_EMAIL_ALLOWLIST:-}
    depends_on:
      couchdb:
        condition: service_healthy
    networks:
      - comment0r

  comments-stream:
    build:
      context: ..
      dockerfile: services/comments-stream/Dockerfile
    environment:
      - PORT=3002
      - COUCHDB_URL=http://admin:password@couchdb:5984
      - COUCHDB_DB=comments
    depends_on:
      couchdb:
        condition: service_healthy
    networks:
      - comment0r

  couchdb:
    image: couchdb:3.4
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=password
    volumes:
      - couchdb-data:/opt/couchdb/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/_up"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - comment0r

networks:
  comment0r:

volumes:
  couchdb-data:
